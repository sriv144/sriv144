name: Update contribution animation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-contributions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'sriv144/sriv144' && github.repository_owner == 'sriv144'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate the actual contribution graph
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: sriv144
          outputs: |
            assets/contributions-light.svg?palette=github-light&color_snake=#087f75&color_dots=#e8eef2,#b9e7dd,#79cdbb,#3b9f8d,#167969
            assets/contributions-dark.svg?palette=github-dark&color_snake=#5eead4&color_dots=#17212e,#174b49,#1f7a70,#31aa91,#69d3b0

      - name: Add accessible descriptions and static alternatives
        run: node scripts/generate-contributions.mjs

      - name: Generate the space arcade scene
        run: python3 scripts/generate-arcade.py --space-only

      - name: Commit changed animation assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/contributions-light.svg assets/contributions-dark.svg assets/contributions-light-static.svg assets/contributions-dark-static.svg assets/space-contributions.svg assets/space-contributions-static.svg
          if git diff --cached --quiet; then
            echo "Contribution animation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution animation [skip ci]"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="#edf5f5" role="img" aria-labelledby="title desc">
  <title id="title">Srivatsan — Applied AI, Data, Systems</title>
  <desc id="desc">@sriv144. From models to useful systems. An orbital diagram connects agents, data, and systems around a code core.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7796a5" stroke-width=".65" opacity=".11"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".1"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".65"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".03"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .ink { fill: #edf5f5; }
    .muted { fill: #9caeb8; }
    .soft { fill: #6d8592; }
    .accent { fill: #5eead4; }
    .enter { animation: reveal 1.3s ease-out both; }
    .flow { animation: flow 4.5s ease-out 1 forwards; }
    .flow-slow { animation: flow 4.5s ease-out reverse 1 forwards; }
    .rotor { transform-origin: 0px 0px; animation: orbit 4.5s ease-out 1 forwards; }
    .rotor-reverse { transform-origin: 0px 0px; animation: orbit 4.5s ease-out reverse 1 forwards; }
    .pulse { animation: pulse 4s ease-in-out 1 forwards; }
    .pulse-two { animation-delay: -1.3s; }
    .pulse-three { animation-delay: -2.6s; }
    .signal { animation: signal 4.5s linear 1 forwards; }
    @keyframes reveal { from { opacity: .85; } to { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -400; } }
    @keyframes orbit { to { transform: rotate(80deg); } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 45% { opacity: .9; } }
    @keyframes signal { to { stroke-dashoffset: -1000; } }
    @media (prefers-reduced-motion: reduce) {
    .enter, .flow, .flow-slow, .rotor, .rotor-reverse, .pulse, .signal {
      animation: none !important;
    }
    .enter { opacity: 1 !important; }
    .rotor, .rotor-reverse { transform: none !important; }
    .pulse { opacity: .5 !important; }
    }
    
    .enter, .flow, .flow-slow, .rotor, .rotor-reverse, .pulse, .signal {
      animation: none !important;
    }
    .enter { opacity: 1 !important; }
    .rotor, .rotor-reverse { transform: none !important; }
    .pulse { opacity: .5 !important; }
    
  </style>
  <rect width="1200" height="430" rx="20" fill="#080f18"/>
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="url(#grid)"/>
  <ellipse cx="912" cy="202.1" rx="420" ry="275.2" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="none" stroke="#203641" stroke-width="1"/>
  <g class="enter">
    <text x="64" y="78" class="mono accent" font-size="15" letter-spacing="2.1">APPLIED AI / DATA / SYSTEMS</text>
    <text x="59" y="181" class="ink" font-size="86" font-weight="650" letter-spacing="-4.8">Srivatsan<tspan class="accent">.</tspan></text>
    <text x="65" y="225" class="mono muted" font-size="21">@sriv144</text>
    <text x="64" y="283" class="ink" font-size="27" letter-spacing="-.5">From models to useful systems.</text>
    <path d="M64 320H636" stroke="url(#edge)"/>
    <circle cx="69" cy="357" r="3.5" class="accent"/>
    <text x="85" y="362" class="mono soft" font-size="13" letter-spacing="1.8">THINK. BUILD. ITERATE.</text>
  </g>
  <g transform="translate(928 213) scale(1)" class="enter">
    <circle r="184" fill="none" stroke="#203641" stroke-width="1" stroke-dasharray="2 10"/>
    <circle r="148" fill="none" stroke="#203641" stroke-width="1"/>
    <path d="M-199 0H199 M0-192V192" stroke="#203641" stroke-width="1" opacity=".55"/>
    <g transform="rotate(-28)">
      <ellipse rx="207" ry="94" fill="none" stroke="#5eead4" stroke-width="1" opacity=".36"/>
      <ellipse class="flow" rx="207" ry="94" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-dasharray="38 362" opacity=".8"/>
    </g>
    <g transform="rotate(40)">
      <ellipse rx="181" ry="79" fill="none" stroke="#5eead4" stroke-width="1" opacity=".2"/>
      <ellipse class="flow-slow" rx="181" ry="79" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="16 384" opacity=".6"/>
    </g>
    <path d="M0 0L101-118 M0 0L-138 65 M0 0L91 127" fill="none" stroke="#5eead4" stroke-width="1" opacity=".23"/>
    <path class="signal" d="M0 0L101-118 M0 0L-138 65 M0 0L91 127" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="5 195" opacity=".6"/>
    <g class="rotor">
      <circle cy="-148" r="4" fill="#5eead4"/>
      <circle cy="-148" r="9" fill="none" stroke="#5eead4" opacity=".18"/>
    </g>
    <g class="rotor-reverse">
      <circle cx="184" r="3" fill="#5eead4" opacity=".75"/>
    </g>
    <circle r="59" fill="#080f18" stroke="#203641" stroke-width="1.4"/>
    <circle r="48" fill="#0c1821" stroke="#5eead4" stroke-width="1" stroke-opacity=".28"/>
    <text x="0" y="12" text-anchor="middle" class="mono accent" font-size="33" font-weight="500" letter-spacing="-3">&lt;/&gt;</text>
    <g transform="translate(101 -118)">
      <circle class="pulse" r="16" fill="none" stroke="#5eead4" stroke-width="1"/>
      <circle r="5" fill="#5eead4"/>
      <rect x="-60" y="-54" width="120" height="32" rx="5" fill="#080f18"/>
      <text y="-30" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="1.2">AGENTS</text>
    </g>
    <g transform="translate(-138 65)">
      <circle class="pulse pulse-two" r="15" fill="none" stroke="#5eead4" stroke-width="1"/>
      <circle r="5" fill="#5eead4"/>
      <rect x="-63" y="21" width="82" height="32" rx="5" fill="#080f18"/>
      <text x="-22" y="44" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="1.2">DATA</text>
    </g>
    <g transform="translate(91 127)">
      <circle class="pulse pulse-three" r="15" fill="none" stroke="#5eead4" stroke-width="1"/>
      <circle r="5" fill="#5eead4"/>
      <rect x="13" y="5" width="132" height="32" rx="5" fill="#080f18"/>
      <text x="78" y="28" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="1.2">SYSTEMS</text>
    </g>
  </g>
</svg>
